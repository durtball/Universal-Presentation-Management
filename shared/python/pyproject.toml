[project]
name = "upm-shared"
version = "0.1.0"
description = "Shared UPM server domain concepts and language-neutral contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "uuid6>=2025.0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upm_shared"]
