name: ${UPM_SITE_PROJECT_NAME:-upm-site}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${SITE_HTTP_PORT:-9080}:80"
    volumes:
      - ./infrastructure/caddy/site/Caddyfile:/etc/caddy/Caddyfile:ro
      - site-caddy-data:/data
      - site-caddy-config:/config
    depends_on:
      site-api:
        condition: service_healthy
      site-web:
        condition: service_healthy
    networks:
      - site-edge

  site-api:
    build:
      context: .
      dockerfile: site/Dockerfile
    image: ${UPM_SITE_API_IMAGE:-upm-site-api:local}
    restart: unless-stopped
    environment:
      UPM_COMPONENT: site-api
      DATABASE_HOST: site-postgres
      UPM_SITE_DATABASE_URL: ${UPM_SITE_DATABASE_URL:?Set UPM_SITE_DATABASE_URL}
      UPM_SITE_MAX_UPLOAD_BYTES: ${UPM_SITE_MAX_UPLOAD_BYTES:-549755813888}
      UPM_SITE_STAGING_MAX_AGE_SECONDS: ${UPM_SITE_STAGING_MAX_AGE_SECONDS:-86400}
      UPM_SITE_TRANSFER_BLOCK_BYTES: ${UPM_SITE_TRANSFER_BLOCK_BYTES:-4194304}
      UPM_SITE_TRANSFER_PARTIAL_RETENTION_SECONDS: ${UPM_SITE_TRANSFER_PARTIAL_RETENTION_SECONDS:-604800}
      UPM_SITE_CREDENTIAL_ENCRYPTION_KEY: ${UPM_SITE_CREDENTIAL_ENCRYPTION_KEY:?Set UPM_SITE_CREDENTIAL_ENCRYPTION_KEY}
      UPM_SITE_CENTRAL_URL: ${UPM_SITE_CENTRAL_URL:-http://upm-central}
      UPM_SITE_DEFAULT_DISPLAY_NAME: ${UPM_SITE_DEFAULT_DISPLAY_NAME:-UPM Site}
      UPM_SITE_MEDIA_STORAGE_URL: http://site-media-storage:8080
      UPM_SITE_MEDIA_STORAGE_TOKEN: ${UPM_SITE_MEDIA_STORAGE_TOKEN:?Set UPM_SITE_MEDIA_STORAGE_TOKEN}
    depends_on:
      site-postgres:
        condition: service_healthy
      site-migrate:
        condition: service_completed_successfully
      site-media-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - site-edge
      - site-internal

  site-web:
    build:
      context: .
      dockerfile: site/web/Dockerfile
    image: ${UPM_SITE_WEB_IMAGE:-upm-site-web:local}
    restart: unless-stopped
    environment:
      UPM_COMPONENT: site-web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - site-edge

  site-migrate:
    image: ${UPM_SITE_API_IMAGE:-upm-site-api:local}
    restart: "no"
    command: ["alembic", "-c", "database/site/alembic.ini", "upgrade", "head"]
    environment:
      UPM_COMPONENT: site-migrate
      DATABASE_HOST: site-postgres
      UPM_SITE_DATABASE_URL: ${UPM_SITE_DATABASE_URL:?Set UPM_SITE_DATABASE_URL}
    depends_on:
      site-postgres:
        condition: service_healthy
    networks:
      - site-internal

  site-worker:
    image: ${UPM_SITE_API_IMAGE:-upm-site-api:local}
    restart: unless-stopped
    command: ["python", "-m", "upm_site.worker"]
    environment:
      UPM_COMPONENT: site-worker
      DATABASE_HOST: site-postgres
      UPM_SITE_DATABASE_URL: ${UPM_SITE_DATABASE_URL:?Set UPM_SITE_DATABASE_URL}
      UPM_SITE_WORKER_CAPABILITIES: ${UPM_SITE_WORKER_CAPABILITIES:-cpu,pdf-conversion,transfer}
      UPM_SITE_WORKER_POLL_INTERVAL_SECONDS: ${UPM_SITE_WORKER_POLL_INTERVAL_SECONDS:-1}
      UPM_SITE_WORKER_LEASE_SECONDS: ${UPM_SITE_WORKER_LEASE_SECONDS:-60}
      UPM_SITE_TRANSFER_BLOCK_BYTES: ${UPM_SITE_TRANSFER_BLOCK_BYTES:-4194304}
      UPM_SITE_TRANSFER_PULL_CONCURRENCY: ${UPM_SITE_TRANSFER_PULL_CONCURRENCY:-1}
      UPM_SITE_TRANSFER_PUSH_CONCURRENCY: ${UPM_SITE_TRANSFER_PUSH_CONCURRENCY:-1}
      UPM_SITE_TRANSFER_PARTIAL_RETENTION_SECONDS: ${UPM_SITE_TRANSFER_PARTIAL_RETENTION_SECONDS:-604800}
      UPM_SITE_CREDENTIAL_ENCRYPTION_KEY: ${UPM_SITE_CREDENTIAL_ENCRYPTION_KEY:?Set UPM_SITE_CREDENTIAL_ENCRYPTION_KEY}
      UPM_SITE_MEDIA_STORAGE_URL: http://site-media-storage:8080
      UPM_SITE_MEDIA_STORAGE_TOKEN: ${UPM_SITE_MEDIA_STORAGE_TOKEN:?Set UPM_SITE_MEDIA_STORAGE_TOKEN}
    depends_on:
      site-postgres:
        condition: service_healthy
      site-migrate:
        condition: service_completed_successfully
      site-media-storage:
        condition: service_healthy
    networks:
      - site-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/upm-site-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  site-media-storage:
    build:
      context: .
      dockerfile: media-storage/Dockerfile
    image: ${UPM_MEDIA_STORAGE_IMAGE:-upm-media-storage:local}
    restart: unless-stopped
    environment:
      UPM_MEDIA_STORAGE_DEPLOYMENT_CONTEXT: site
      UPM_MEDIA_STORAGE_SERVICE_TOKEN: ${UPM_SITE_MEDIA_STORAGE_TOKEN:?Set UPM_SITE_MEDIA_STORAGE_TOKEN}
      UPM_MEDIA_STORAGE_STATE_PATH: /state/assignments.json
      UPM_MEDIA_STORAGE_TARGETS_JSON: '${UPM_SITE_STORAGE_TARGETS_JSON:-[{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000014","name":"Site Staging Storage","internal_path":"/storage/staging","roles":["staging"]},{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000002","name":"Site Media Storage","internal_path":"/storage/media","roles":["media"]},{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000001","name":"Site Temporary Storage","internal_path":"/storage/temp","roles":["staging"]}]}'
    volumes:
      - ${UPM_SITE_STAGING_HOST_PATH:-site-storage-staging}:/storage/staging
      - ${UPM_SITE_MEDIA_HOST_PATH:-site-storage-media}:/storage/media
      - ${UPM_SITE_TEMP_HOST_PATH:-site-storage-temp}:/storage/temp
      - site-storage-state:/state
    networks:
      - site-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  site-sync:
    image: ${UPM_SITE_API_IMAGE:-upm-site-api:local}
    restart: unless-stopped
    command: ["python", "-m", "upm_site.worker", "--sync"]
    environment:
      UPM_COMPONENT: site-sync
      DATABASE_HOST: site-postgres
      UPM_SITE_DATABASE_URL: ${UPM_SITE_DATABASE_URL:?Set UPM_SITE_DATABASE_URL}
      UPM_SITE_WORKER_CAPABILITIES: sync
      UPM_SITE_CREDENTIAL_ENCRYPTION_KEY: ${UPM_SITE_CREDENTIAL_ENCRYPTION_KEY:?Set UPM_SITE_CREDENTIAL_ENCRYPTION_KEY}
      UPM_SITE_CENTRAL_URL: ${UPM_SITE_CENTRAL_URL:-http://upm-central}
    depends_on:
      site-postgres:
        condition: service_healthy
      site-migrate:
        condition: service_completed_successfully
    networks:
      - site-internal
      - site-sync-egress
      - upm-integration
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/upm-site-worker-ready-sync"]
      interval: 10s
      timeout: 3s
      retries: 5

  site-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SITE_POSTGRES_DB:?Set SITE_POSTGRES_DB}
      POSTGRES_USER: ${SITE_POSTGRES_USER:?Set SITE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SITE_POSTGRES_PASSWORD:?Set SITE_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SITE_POSTGRES_USER:?Set SITE_POSTGRES_USER} -d ${SITE_POSTGRES_DB:?Set SITE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - site-postgres-data:/var/lib/postgresql/data
    networks:
      - site-internal

networks:
  site-edge:
  site-internal:
    internal: true
  site-sync-egress:
  upm-integration:
    name: ${UPM_INTEGRATION_NETWORK:-upm-integration}
    external: ${UPM_INTEGRATION_NETWORK_EXTERNAL:-true}

volumes:
  site-caddy-data:
  site-caddy-config:
  site-postgres-data:
  site-storage-temp:
  site-storage-staging:
  site-storage-media:
  site-storage-state:
