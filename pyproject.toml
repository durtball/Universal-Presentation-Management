[project]
name = "upm-development"
version = "0.1.0"
description = "Development tooling for the Universal Presentation Management monorepo"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "shared/python",
  "central/python",
  "site/python",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/python"]
markers = [
  "postgres: requires isolated Central and Site PostgreSQL databases",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
  "shared/python/src",
  "central/python/src",
  "site/python/src",
  "tests/python",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
