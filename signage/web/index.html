<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UPM Signage</title><meta name="upm-layout-api" content="/api/v1/layouts"><style>
:root{color-scheme:dark;--bg:#080d14;--panel:#101822;--panel2:#151f2b;--line:#263443;--muted:#93a1b2;--blue:#2f82ff;--danger:#d95d70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4fb;font:14px Inter,Segoe UI,sans-serif}button,input,select,textarea{font:inherit;color:inherit;background:#111c28;border:1px solid #34465a;border-radius:5px;padding:8px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.primary{background:var(--blue);border-color:var(--blue)}.danger{border-color:var(--danger)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.card{width:min(390px,90vw);background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:10px}.card input{width:100%;margin:6px 0 14px}.error{color:#ff9dab}.shell{height:100vh;display:grid;grid-template-columns:190px 1fr;grid-template-rows:58px 1fr}.top{grid-column:1/3;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 18px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--blue);font-weight:500}.health{margin-left:auto;color:var(--muted)}nav{border-right:1px solid var(--line);padding:18px 10px;background:#0c131c}nav button{width:100%;text-align:left;border:0;background:transparent;margin:3px 0}nav button.active{background:#173963}.page{padding:22px;overflow:auto}h1{margin-top:0}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:16px}.metric b{display:block;font-size:25px;margin-top:8px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.designer{display:grid;grid-template-columns:220px minmax(400px,1fr) 245px;gap:10px;height:calc(100vh - 150px)}.elements,.properties{background:var(--panel);border:1px solid var(--line);padding:12px;overflow:auto}.elements button{width:100%;text-align:left;margin:3px 0}.stageWrap{background:#0b121b;border:1px solid var(--line);overflow:auto;padding:24px;display:grid;place-items:center}.canvas{position:relative;transform-origin:center;background:#101a2c;box-shadow:0 8px 30px #000;overflow:hidden}.canvas.grid{background-color:#101a2c;background-image:linear-gradient(#2a3850 1px,transparent 1px),linear-gradient(90deg,#2a3850 1px,transparent 1px)}.safe{position:absolute;border:1px dashed #f4ba4a;pointer-events:none}.el{position:absolute;border:1px solid transparent;overflow:hidden;white-space:pre-wrap}.el.selected{outline:2px solid #49a1ff}.el.locked{outline-style:dashed}.el img{width:100%;height:100%;object-fit:contain}.resize{position:absolute;width:12px;height:12px;right:-1px;bottom:-1px;background:#49a1ff;cursor:nwse-resize}.field{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.field label{color:var(--muted)}.field input,.field select{width:100%}.status{padding:8px 12px;border-radius:5px}.ok{background:#123a27}.bad{background:#481a24}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}dialog{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:8px;max-width:95vw}dialog::backdrop{background:#000b}.preview{position:relative;background:#101a2c;overflow:hidden}
</style></head><body>
<section id="login" class="login"><form id="loginForm" class="card"><div class="brand">UPM <span>SIGNAGE</span></div><h1>Sign in</h1><label>Username<input id="username" autocomplete="username" value="admin" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">SIGN IN</button><p id="loginError" class="error"></p></form></section>
<section id="app" class="shell hidden"><header class="top"><div class="brand">UPM <span>SIGNAGE</span></div><div id="health" class="health">Signage Service · Connecting</div></header><nav id="nav"></nav><main id="page" class="page"></main></section>
<dialog id="previewDialog"><div class="toolbar"><b>Layout preview</b><span style="flex:1"></span><button onclick="previewDialog.close()">Close</button></div><div id="preview" class="preview"></div></dialog>
<script>
const $=id=>document.getElementById(id);let csrf='',route='dashboard',events=[],rooms=[],layouts=[],displays=[],layout=null,selected=null,history=[],future=[],clipboard=null,grid=true,snap=true,guides=true,gridSize=20,zoom=.35,drag=null;
async function api(path,opt={}){opt.headers={...(opt.body?{'content-type':'application/json'}:{}),...(csrf?{'X-CSRF-Token':csrf}:{}),...opt.headers};let r=await fetch('/api/v1'+path,opt);if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||`${r.status} ${r.statusText}`);return r.status===204?null:r.json()}
loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{let x=await api('/auth/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});csrf=x.csrf_token;password.value='';sessionStorage.setItem('upm-default-password',x.default_password?'1':'0');window.chrome?.webview?.postMessage({type:'operator-session-changed'});login.classList.add('hidden');app.classList.remove('hidden');await load();}catch(e){loginError.textContent=e.message}};
const navs=[['dashboard','Dashboard'],['displays','Displays'],['layouts','Layouts'],['templates','Templates'],['schedule','Schedule'],['assets','Assets'],['settings','Settings']];function drawNav(){nav.innerHTML=navs.map(x=>`<button class="${route===x[0]?'active':''}" data-route="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{route=b.dataset.route;drawNav();render()})}
async function load(){drawNav();let [h,e,l,d]=await Promise.all([fetch('/health').then(x=>x.json()),api('/events'),api('/layouts'),api('/displays')]);events=e;layouts=l;displays=d;health.textContent=`Signage Service · Online | Site Source · ${h.source_connected?'Connected':'Offline'} | Displays · ${h.displays.online}/${h.displays.configured}`;render()}
function render(){if(route==='dashboard')dashboard();else if(route==='displays')displayManager();else if(route==='layouts'||route==='templates')layoutList();else if(route==='schedule')schedule();else if(route==='assets')assetsPage();else if(route==='settings')settings();else unavailable(route)}
function dashboard(){page.innerHTML=`<h1>Dashboard</h1>${sessionStorage.getItem('upm-default-password')==='1'?'<div class="panel"><b>You are using the default administrator password.</b> <button id="changeDefault">Change Password</button></div>':''}<div class="metrics"><div class="metric">Signage Service<b>Online</b></div><div class="metric">Site Source<b>${health.textContent.includes('Connected')?'Connected':'Offline'}</b></div><div class="metric">Events<b>${events.length}</b></div><div class="metric">Displays<b>${displays.length} configured</b></div></div>`;let changeDefault=$('changeDefault');if(changeDefault)changeDefault.onclick=()=>{route='settings';drawNav();render()}}
async function assetsPage(){page.innerHTML=`<div class="toolbar"><h1>Assets</h1><input id="assetSearch" placeholder="Search assets"><select id="assetEvent">${eventOptions()}</select><input id="assetFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"><button class="primary" id="uploadAsset">UPLOAD IMAGE / LOGO</button></div><div id="assetGrid" class="metrics">Loading assets…</div>`;async function refresh(){let query=new URLSearchParams();if(assetEvent.value)query.set('event_id',assetEvent.value);if(assetSearch.value)query.set('search',assetSearch.value);let rows=await api('/assets?'+query);assetGrid.innerHTML=rows.map(a=>`<div class="panel"><img src="${a.content_url}" alt="" style="width:100%;height:130px;object-fit:contain"><b>${esc(a.name)}</b><p>${esc(a.original_filename)} · ${Math.ceil(a.size/1024)} KiB · Used ${a.usage_count} time(s)</p><div class="toolbar"><label class="tool">Replace<input hidden type="file" accept="image/*" data-replace="${a.asset_id}"></label><button data-delete="${a.asset_id}" ${a.usage_count?'disabled':''}>Delete unused</button></div></div>`).join('')||'<div class="panel">No matching assets.</div>';assetGrid.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{await api('/assets/'+b.dataset.delete,{method:'DELETE'});refresh()});assetGrid.querySelectorAll('[data-replace]').forEach(i=>i.onchange=async()=>{let f=new FormData();f.append('file',i.files[0]);await fetch('/api/v1/assets/'+i.dataset.replace,{method:'PUT',headers:{'X-CSRF-Token':csrf},body:f}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail)});refresh()})}uploadAsset.onclick=async()=>{if(!assetFile.files[0])return;let f=new FormData();f.append('file',assetFile.files[0]);f.append('event_id',assetEvent.value);f.append('name',assetFile.files[0].name);let r=await fetch('/api/v1/assets',{method:'POST',headers:{'X-CSRF-Token':csrf},body:f});if(!r.ok)throw Error((await r.json()).detail);assetFile.value='';refresh()};assetSearch.oninput=refresh;assetEvent.onchange=refresh;await refresh()}
function unavailable(name){page.innerHTML=`<h1>${name}</h1><div class="panel"><b>Not available yet</b><p>This capability is intentionally disabled until its application-level media or connection contract is implemented.</p></div>`}
function settings(){page.innerHTML=`<h1>Settings</h1><div class="panel"><h2>Change password</h2><form id="passwordForm"><label>Current password<input id="currentPassword" type="password" required></label><label>New password<input id="newPassword" type="password" minlength="8" required></label><button class="primary">CHANGE PASSWORD</button><span id="passwordStatus"></span></form><details><summary>Advanced / Diagnostics</summary><p>Connection endpoint: ${esc(location.origin)}</p></details></div>`;passwordForm.onsubmit=async e=>{e.preventDefault();try{await api('/auth/password',{method:'PUT',body:JSON.stringify({current_password:currentPassword.value,new_password:newPassword.value})});passwordStatus.textContent='Password changed. Sign in again.';setTimeout(()=>location.reload(),1200)}catch(e){passwordStatus.textContent=e.message}}}
function eventOptions(id=''){return `<option value="">Select event</option>`+events.map(e=>`<option value="${e.event_id}" ${id===e.event_id?'selected':''}>${esc(e.name)}${e.starts_at?' · '+new Date(e.starts_at).toLocaleDateString():''}${e.ends_at?'–'+new Date(e.ends_at).toLocaleDateString():''}${e.site_name?' · '+esc(e.site_name):''}</option>`).join('')}
async function getRooms(eventId){return eventId?api(`/events/${eventId}/rooms`):[]}
function displayManager(){page.innerHTML=`<div class="toolbar"><h1>Displays</h1><span style="flex:1"></span><button class="primary" id="newDisplay">CREATE DISPLAY</button></div><div class="panel"><table><thead><tr><th>Name</th><th>Status</th><th>Event</th><th>Room</th><th>Mode</th><th>Current Layout</th><th>Resolution</th><th>Last Seen</th><th>Player Version</th><th></th></tr></thead><tbody>${displays.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.status.replaceAll('_',' '))}</td><td>${esc(d.event_name||'—')}</td><td>${esc(d.room_name||'—')}</td><td>${d.mode.replace('_',' ')}</td><td>${esc(d.current_layout||'—')}</td><td>${d.width}×${d.height}</td><td>${d.last_seen_at?new Date(d.last_seen_at).toLocaleString():'Never'}</td><td>${esc(d.player_version||'—')}</td><td><button data-reassign="${d.display_id}">Reassign</button><button data-unpair="${d.display_id}" ${!d.enabled?'disabled':''}>Unpair</button><button data-delete-display="${d.display_id}" ${d.enabled?'disabled':''}>Delete</button></td></tr>`).join('')||'<tr><td colspan="10">No displays configured.</td></tr>'}</tbody></table></div><dialog id="displayDialog"><form id="displayForm" class="card"><h2>Create display</h2><label>Display name<input id="dn" required></label><label>Event<select id="de" required>${eventOptions()}</select></label><label>Assignment<select id="dm"><option value="lobby">Lobby / General</option><option value="room_door">Room Door</option><option value="playlist">Playlist</option></select></label><label>Room<select id="dr" disabled><option>Select an event</option></select></label><label>Layout<select id="dl"><option value="">Automatic / unchanged</option>${layouts.filter(x=>x.published_revision).map(x=>`<option value="${x.layout_id}">${esc(x.name)}</option>`).join('')}</select></label><label>Orientation<select id="dor"><option value="portrait">Portrait</option><option value="landscape">Landscape</option><option value="custom">Custom</option></select></label><div class="field"><label>Width<input id="dw" type="number" min="320" value="1080"></label><label>Height<input id="dh" type="number" min="240" value="1920"></label></div><div class="toolbar"><button type="button" onclick="displayDialog.close()">Cancel</button><button class="primary">CREATE DISPLAY</button></div><p id="displayError" class="error"></p></form></dialog>`;newDisplay.onclick=()=>displayDialog.showModal();de.onchange=dm.onchange=async()=>{let values=await getRooms(de.value);dr.innerHTML=values.map(r=>`<option value="${r.room_id}">${esc(r.name)}</option>`).join('');dr.disabled=dm.value!=='room_door'};displayForm.onsubmit=async e=>{e.preventDefault();try{let body={event_id:de.value||null,room_id:dm.value==='room_door'?dr.value:null,mode:dm.value,width:+dw.value,height:+dh.value,orientation:dor.value,layout_id:dl.value||null};let x;if(displayForm.dataset.reassign){x=await api('/displays/'+displayForm.dataset.reassign+'/assignment',{method:'PUT',body:JSON.stringify(body)})}else{x=await api('/displays',{method:'POST',body:JSON.stringify({...body,name:dn.value,orientation:dor.value,width:+dw.value,height:+dh.value})});window.chrome?.webview?.postMessage({type:'store-display-credential',displayId:x.display_id,credential:x.player_credential})}delete displayForm.dataset.reassign;displays=await api('/displays');displayDialog.close();displayManager()}catch(e){displayError.textContent=e.message}};page.querySelectorAll('[data-reassign]').forEach(b=>b.onclick=async()=>{let d=displays.find(x=>x.display_id===b.dataset.reassign);displayDialog.showModal();dn.value=d.name;de.value=d.event_id||'';dm.value=d.mode;dor.value=d.orientation;dw.value=d.width;dh.value=d.height;await de.onchange();displayForm.dataset.reassign=d.display_id});page.querySelectorAll('[data-delete-display]').forEach(b=>b.onclick=async()=>{await api('/displays/'+b.dataset.deleteDisplay,{method:'DELETE'});displays=await api('/displays');displayManager()});page.querySelectorAll('[data-unpair]').forEach(b=>b.onclick=async()=>{if(confirm('Unpair this display and invalidate its player credential?')){await api(`/displays/${b.dataset.unpair}/unpair`,{method:'POST'});displays=await api('/displays');displayManager()}})}
function layoutList(){let templatesOnly=route==='templates';page.innerHTML=`<div class="toolbar"><h1>${templatesOnly?'Templates':'Layouts'}</h1>${templatesOnly?`<select id="templateEvent">${eventOptions()}</select><select id="templateRoom"><option value="">Apply to event / global</option></select>`:''}<span style="flex:1"></span><button class="primary" id="newLayout" aria-label="Create Layout">CREATE ${templatesOnly?'TEMPLATE':'LAYOUT'}</button></div><div class="panel"><table><thead><tr><th>Name</th><th>Mode</th><th>Canvas</th><th>Draft</th><th>Published</th></tr></thead><tbody>${layouts.filter(x=>(x.mode==='template')===templatesOnly).map(x=>`<tr data-layout="${x.layout_id}"><td>${esc(x.name)}</td><td>${x.mode}</td><td>${x.width}×${x.height}</td><td>${x.draft_revision}</td><td>${x.published_revision||'—'}</td>${templatesOnly?`<td><button data-duplicate="${x.layout_id}">Duplicate</button><button data-apply="${x.layout_id}">Apply</button><button data-delete-template="${x.layout_id}" ${x.published_revision?'disabled':''}>Delete</button></td>`:''}</tr>`).join('')||'<tr><td colspan="5">No persisted layouts.</td></tr>'}</tbody></table></div>`;if(templatesOnly)templateEvent.onchange=async()=>{let rs=await getRooms(templateEvent.value);templateRoom.innerHTML='<option value="">Apply to event / global</option>'+rs.map(r=>`<option value="${r.room_id}">${esc(r.name)}</option>`).join('')};newLayout.onclick=()=>{layout={name:templatesOnly?'New template':'New layout',description:'',event_id:null,mode:templatesOnly?'template':'room_door',width:1080,height:1920,orientation:'portrait',safe_area:{top:60,right:60,bottom:60,left:60},background:{color:'#101a2c'},elements:[],configuration:{grid:true,snap:true,guides:true,grid_size:20}};selected=null;history=[];designer()};page.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await api('/templates/'+b.dataset.duplicate+'/duplicate',{method:'POST'});layouts=await api('/layouts');layoutList()});page.querySelectorAll('[data-delete-template]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await api('/templates/'+b.dataset.deleteTemplate,{method:'DELETE'});layouts=await api('/layouts');layoutList()});page.querySelectorAll('[data-apply]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!templateEvent.value)return;let created=await api('/templates/'+b.dataset.apply+'/apply',{method:'POST',body:JSON.stringify({event_id:templateEvent.value,room_id:templateRoom.value||null})});layouts=await api('/layouts');layout=created;designer()});page.querySelectorAll('[data-layout]').forEach(r=>r.onclick=async()=>{layout=await api('/layouts/'+r.dataset.layout);selected=null;history=[];grid=layout.configuration.grid??true;snap=layout.configuration.snap??true;guides=layout.configuration.guides??true;gridSize=layout.configuration.grid_size||20;designer()})}
function designer(){page.innerHTML=`<div class="toolbar"><button id="back">← Layouts</button><input id="layoutName" value="${esc(layout.name)}"><select id="eventSelect">${eventOptions(layout.event_id)}</select><button id="undo">Undo</button><button id="redo">Redo</button><button id="grid">Grid ${grid?'On':'Off'}</button><button id="snap">Snap ${snap?'On':'Off'}</button><button id="guides">Guides ${guides?'On':'Off'}</button><select id="gridSize"><option>10</option><option>20</option><option>40</option><option>80</option></select><select id="zoom"><option value=".2">20%</option><option value=".35">35%</option><option value=".5">50%</option><option value=".75">75%</option><option value="1">100%</option></select><span style="flex:1"></span><button id="previewBtn">Preview</button><button id="save">Save Draft</button><button class="primary" id="publish" aria-label="Publish Layout">Publish Layout</button><button id="rollback" ${!layout.published_revision||layout.published_revision<2?'disabled':''}>Roll Back</button><span id="saveStatus"></span></div><div class="designer"><aside class="elements"><h3>Add Element</h3>${[['room_name','Room Name'],['current_session_title','Current Session Block'],['session_time','Session Time'],['presenter_names','Presenter Name(s)'],['next_session_title','Next Session Title'],['next_session_time','Next Session Time'],['countdown','Countdown Timer'],['event_logo','Event Logo'],['room_logo','Room Logo / Icon'],['custom_text','Custom Text'],['date_time','Date / Time'],['ticker','Ticker / Scroller'],['qr_code','QR Code'],['image','Image'],['rotating_slides','Rotating Slides']].map(x=>`<button data-add="${x[0]}">${x[1]}</button>`).join('')}<h3>LAYERS</h3><div id="layers"></div></aside><section class="stageWrap"><div id="canvas" class="canvas"></div></section><aside class="properties"><h3>Canvas Size</h3><div class="field"><label>Width<input id="cw" type="number" value="${layout.width}"></label><label>Height<input id="ch" type="number" value="${layout.height}"></label></div><label>Template Breakpoints<select id="preset"><option value="">Custom</option><option value="1920,1080">Landscape 1080p</option><option value="3840,2160">Landscape 4K</option><option value="1080,1920">Portrait / Totem</option><option value="2160,3840">Portrait 4K</option><option value="3840,1080">Ultra Wide</option></select></label><h3 aria-label="Position & Size">Position &amp; Size / Typography</h3><div id="props">Select an element.</div></aside></div>`;wireDesigner();drawCanvas()}
function snapshot(){return JSON.stringify({elements:layout.elements,width:layout.width,height:layout.height,safe_area:layout.safe_area,background:layout.background})}function remember(){history.push(snapshot());if(history.length>100)history.shift();future=[]}function restore(raw){let x=JSON.parse(raw);Object.assign(layout,x);selected=null;designer()}function add(type){remember();let id=crypto.randomUUID(),text=type.replaceAll('_',' ');layout.elements.push({element_id:id,type,x:gridSize,y:gridSize,width:Math.min(600,layout.width-gridSize*2),height:Math.min(140,layout.height-gridSize*2),z_index:layout.elements.length,visibility:true,locked:false,rotation:0,opacity:1,style:{font_family:'Segoe UI',font_size:54,font_weight:600,color:'#ffffff',text_align:'left',line_height:1.2,italic:false,underline:false},data_binding:{field:type},fallback_value:type==='custom_text'?'Custom text':text});selected=id;drawCanvas()}
function wireDesigner(){back.onclick=()=>{route=layout.mode==='template'?'templates':'layouts';render()};layoutName.oninput=()=>layout.name=layoutName.value;eventSelect.onchange=()=>layout.event_id=eventSelect.value||null;gridSize.value=String(gridSize);zoom.value=String(zoom);grid.onclick=()=>{grid=!grid;designer()};snap.onclick=()=>{snap=!snap;designer()};guides.onclick=()=>{guides=!guides;designer()};gridSize.onchange=()=>{gridSize=+gridSize.value;designer()};zoom.onchange=()=>{zoom=+zoom.value;drawCanvas()};undo.onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop())}};redo.onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop())}};page.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));cw.onchange=()=>resizeCanvas(+cw.value,layout.height);ch.onchange=()=>resizeCanvas(layout.width,+ch.value);preset.onchange=()=>{if(preset.value){let [w,h]=preset.value.split(',').map(Number);resizeCanvas(w,h)}};save.onclick=()=>persist(false);publish.onclick=()=>persist(true);rollback.onclick=async()=>{layout=await api(`/layouts/${layout.layout_id}/rollback`,{method:'POST'});ok('Rolled back to the previous immutable publication.');designer()};previewBtn.onclick=showPreview;document.onkeydown=keyHandler}
function resizeCanvas(w,h){if(w<320||h<240)return;remember();layout.width=w;layout.height=h;layout.orientation=w===h?'custom':w>h?'landscape':'portrait';layout.elements.forEach(e=>{e.x=Math.min(e.x,w-e.width);e.y=Math.min(e.y,h-e.height)});designer()}
function scale(){return Math.min(zoom,760/layout.width,620/layout.height)}function drawCanvas(){let s=scale();canvas.style.width=layout.width*s+'px';canvas.style.height=layout.height*s+'px';canvas.classList.toggle('grid',grid);canvas.style.backgroundColor=layout.background.color||'#101a2c';canvas.style.backgroundSize=`${gridSize*s}px ${gridSize*s}px`;canvas.innerHTML=(guides?`<div class="safe" style="left:${(layout.safe_area.left||0)*s}px;top:${(layout.safe_area.top||0)*s}px;right:${(layout.safe_area.right||0)*s}px;bottom:${(layout.safe_area.bottom||0)*s}px"></div>`:'')+layout.elements.filter(e=>e.visibility).sort((a,b)=>a.z_index-b.z_index).map(e=>elementHtml(e,s)).join('');canvas.querySelectorAll('.el').forEach(node=>{node.onpointerdown=startDrag;node.onclick=x=>{x.stopPropagation();selected=node.dataset.id;drawCanvas()}});canvas.onclick=()=>{selected=null;drawCanvas()};drawLayers();drawProps()}
function elementHtml(e,s){let st=e.style||{},content=['image','event_logo','room_logo','qr_code','rotating_slides'].includes(e.type)?`<div style="display:grid;place-items:center;height:100%;border:1px dashed #58708d">${esc(e.fallback_value||e.type.replaceAll('_',' '))}</div>`:esc(e.fallback_value||e.type.replaceAll('_',' '));return `<div class="el ${selected===e.element_id?'selected':''} ${e.locked?'locked':''}" data-id="${e.element_id}" style="left:${e.x*s}px;top:${e.y*s}px;width:${e.width*s}px;height:${e.height*s}px;z-index:${e.z_index};opacity:${e.opacity};transform:rotate(${e.rotation||0}deg);font-family:${esc(st.font_family||'Segoe UI')};font-size:${(st.font_size||54)*s}px;font-weight:${st.font_weight||400};font-style:${st.italic?'italic':'normal'};text-decoration:${st.underline?'underline':'none'};text-align:${st.text_align||'left'};line-height:${st.line_height||1.2};color:${st.color||'#fff'}">${content}${selected===e.element_id&&!e.locked?'<span class="resize" data-resize="1"></span>':''}</div>`}
function startDrag(ev){let e=layout.elements.find(x=>x.element_id===ev.currentTarget.dataset.id);if(!e||e.locked)return;ev.preventDefault();ev.stopPropagation();selected=e.element_id;remember();let s=scale(),start={x:ev.clientX,y:ev.clientY,ex:e.x,ey:e.y,w:e.width,h:e.height,resize:!!ev.target.dataset.resize};drag=start;ev.currentTarget.setPointerCapture(ev.pointerId);ev.currentTarget.onpointermove=x=>{let dx=(x.clientX-start.x)/s,dy=(x.clientY-start.y)/s;if(start.resize){e.width=Math.max(20,Math.min(layout.width-e.x,start.w+dx));e.height=Math.max(20,Math.min(layout.height-e.y,start.h+dy))}else{e.x=Math.max(0,Math.min(layout.width-e.width,start.ex+dx));e.y=Math.max(0,Math.min(layout.height-e.height,start.ey+dy));if(snap){e.x=Math.round(e.x/gridSize)*gridSize;e.y=Math.round(e.y/gridSize)*gridSize}}drawCanvas()};ev.currentTarget.onpointerup=()=>drag=null}
function drawLayers(){if(!layers)return;layers.innerHTML=[...layout.elements].sort((a,b)=>b.z_index-a.z_index).map(e=>`<div><button data-layer="${e.element_id}">${e.visibility?'◉':'○'} ${esc(e.fallback_value||e.type)}</button></div>`).join('');layers.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.layer;drawCanvas()})}
function drawProps(){if(!props)return;let e=layout.elements.find(x=>x.element_id===selected);if(!e){props.innerHTML='Select an element.';return}let st=e.style;props.innerHTML=`<label>Fallback / Text<textarea id="pv">${esc(e.fallback_value)}</textarea></label>${['image','event_logo','room_logo','rotating_slides'].includes(e.type)?'<label>Asset<select id="assetPicker"><option value="">Select asset</option></select></label>':''}<div class="field"><label>X<input id="px" type="number" value="${e.x}"></label><label>Y<input id="py" type="number" value="${e.y}"></label><label>Width<input id="pw" type="number" value="${e.width}"></label><label>Height<input id="ph" type="number" value="${e.height}"></label></div><label>Font<input id="font" value="${esc(st.font_family)}"></label><div class="field"><label>Size<input id="fs" type="number" value="${st.font_size}"></label><label>Weight<select id="fw"><option>400</option><option>600</option><option>700</option><option>800</option></select></label><label>Color<input id="color" type="color" value="${st.color}"></label><label>Align<select id="align"><option>left</option><option>center</option><option>right</option></select></label><label>Line height<input id="lh" type="number" step=".1" value="${st.line_height}"></label><label>Opacity<input id="opacity" type="number" min="0" max="1" step=".1" value="${e.opacity}"></label></div><div class="toolbar"><button id="italic">Italic</button><button id="underline">Underline</button><button id="duplicate">Duplicate</button><button id="up">Bring forward</button><button id="down">Send backward</button><button id="lock">${e.locked?'Unlock':'Lock'}</button><button id="hide">Hide</button><button class="danger" id="delete">Delete</button></div>`;fw.value=String(st.font_weight);align.value=st.text_align;let assetPicker=$('assetPicker');if(assetPicker){api('/assets'+(layout.event_id?'?event_id='+layout.event_id:'')).then(rows=>{assetPicker.innerHTML='<option value="">Select asset</option>'+rows.map(a=>`<option value="${a.asset_id}">${esc(a.name)}</option>`).join('');assetPicker.value=e.data_binding.asset_id||'';assetPicker.onchange=()=>{remember();e.data_binding.asset_id=assetPicker.value;drawCanvas()}})};['pv','px','py','pw','ph','font','fs','fw','color','align','lh','opacity'].forEach(id=>$(id).onchange=()=>{remember();Object.assign(e,{fallback_value:pv.value,x:+px.value,y:+py.value,width:+pw.value,height:+ph.value,opacity:+opacity.value});Object.assign(st,{font_family:font.value,font_size:+fs.value,font_weight:+fw.value,color:color.value,text_align:align.value,line_height:+lh.value});drawCanvas()});italic.onclick=()=>{remember();st.italic=!st.italic;drawCanvas()};underline.onclick=()=>{remember();st.underline=!st.underline;drawCanvas()};duplicate.onclick=()=>duplicateEl(e);up.onclick=()=>{remember();e.z_index=Math.max(...layout.elements.map(x=>x.z_index))+1;drawCanvas()};down.onclick=()=>{remember();e.z_index=Math.min(...layout.elements.map(x=>x.z_index))-1;drawCanvas()};lock.onclick=()=>{remember();e.locked=!e.locked;drawCanvas()};hide.onclick=()=>{remember();e.visibility=false;selected=null;drawCanvas()};$('delete').onclick=()=>remove(e)}
function duplicateEl(e){remember();let x=structuredClone(e);x.element_id=crypto.randomUUID();x.x=Math.min(layout.width-x.width,x.x+gridSize);x.y=Math.min(layout.height-x.height,x.y+gridSize);x.z_index=layout.elements.length;layout.elements.push(x);selected=x.element_id;drawCanvas()}function remove(e){remember();layout.elements=layout.elements.filter(x=>x!==e);selected=null;drawCanvas()}
function keyHandler(e){if(!selected||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;let x=layout.elements.find(x=>x.element_id===selected);if(!x)return;if(e.key==='Delete'){remove(x);return}if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();duplicateEl(x);return}if((e.ctrlKey||e.metaKey)&&e.key==='c'){clipboard=structuredClone(x);return}if((e.ctrlKey||e.metaKey)&&e.key==='v'&&clipboard){duplicateEl(clipboard);return}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo.click();return}let d=e.shiftKey?10:1;if(e.key.startsWith('Arrow')){remember();if(e.key==='ArrowLeft')x.x=Math.max(0,x.x-d);if(e.key==='ArrowRight')x.x=Math.min(layout.width-x.width,x.x+d);if(e.key==='ArrowUp')x.y=Math.max(0,x.y-d);if(e.key==='ArrowDown')x.y=Math.min(layout.height-x.height,x.y+d);drawCanvas()}}
async function persist(publishNow){saveStatus.textContent='Saving…';try{let body={name:layout.name,description:layout.description,event_id:layout.event_id||null,mode:layout.mode,width:layout.width,height:layout.height,orientation:layout.orientation,safe_area:layout.safe_area,background:layout.background,elements:layout.elements,configuration:{grid,snap,guides,grid_size:gridSize}};layout=layout.layout_id?await api('/layouts/'+layout.layout_id,{method:'PUT',body:JSON.stringify(body)}):await api('/layouts',{method:'POST',body:JSON.stringify(body)});if(publishNow)layout=await api(`/layouts/${layout.layout_id}/publish`,{method:'POST'});layouts=await api('/layouts');ok(publishNow?`Published revision ${layout.published_revision}`:`Draft revision ${layout.draft_revision} saved`)}catch(e){saveStatus.className='status bad';saveStatus.textContent=e.message}}
function ok(x){saveStatus.className='status ok';saveStatus.textContent=x}function showPreview(){let s=Math.min(.7,900/layout.width,700/layout.height);preview.style.width=layout.width*s+'px';preview.style.height=layout.height*s+'px';preview.innerHTML=layout.elements.filter(e=>e.visibility).map(e=>elementHtml(e,s)).join('');previewDialog.showModal()}
async function schedule(){page.innerHTML=`<h1>Room Schedule</h1><div class="toolbar"><select id="se">${eventOptions()}</select><select id="sr"><option>Select an event</option></select><input id="sat" type="datetime-local"><button id="loadSchedule">LOAD SCHEDULE</button></div><div id="scheduleBody" class="panel">Select an event and room.</div>`;se.onchange=async()=>{rooms=await getRooms(se.value);sr.innerHTML=rooms.map(r=>`<option value="${r.room_id}">${esc(r.name)}</option>`).join('')};loadSchedule.onclick=async()=>{let rows=(await api(`/events/${se.value}/schedule`)).filter(x=>x.room_id===sr.value).sort((a,b)=>(a.starts_at||'').localeCompare(b.starts_at||''));scheduleBody.innerHTML=`<h2>${esc(rooms.find(x=>x.room_id===sr.value)?.name||'Room')}</h2>`+(rows.map(x=>`<p><b>${x.starts_at?new Date(x.starts_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Time pending'}</b><br>${esc(x.title)}</p>`).join('')||'<p>No synchronized sessions for this room.</p>')} }
function eventName(id){return esc(events.find(x=>x.event_id===id)?.name||'—')}function roomName(id){return esc(rooms.find(x=>x.room_id===id)?.name||'—')}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
api('/auth/session').then(x=>{csrf=x.csrf_token;login.classList.add('hidden');app.classList.remove('hidden');load()}).catch(()=>{});
</script></body></html>
