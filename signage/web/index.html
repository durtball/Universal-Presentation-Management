<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>UPM Signage</title><style>body{font:16px system-ui;background:#101827;color:#eef;margin:2rem}main{max-width:70rem;margin:auto}.card{background:#1d293b;padding:1.5rem;border-radius:1rem}input,select,button{padding:.7rem;margin:.3rem}</style></head><body><main><h1>UPM Signage</h1><div class="card"><h2>Pair display</h2><p>Generate a revocable player credential. Event and room identities come from the synchronized Site projection.</p><form id="pair"><input name="password" type="password" required placeholder="Operator password"><input name="name" required placeholder="Display name"><select name="aspect_ratio"><option>9:16</option><option>16:9</option></select><select name="mode"><option value="room_door">Room door</option><option value="playlist">Non-event playlist</option></select><input name="event_id" placeholder="Event UUID"><input name="room_id" placeholder="Room UUID"><button>Pair</button></form><pre id="result"></pre></div></main><script>pair.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(pair));let password=x.password;delete x.password;x.event_id=x.event_id||null;x.room_id=x.room_id||null;let r=await fetch('/api/v1/displays/pair',{method:'POST',headers:{'content-type':'application/json','X-UPM-Operator-Password':password},body:JSON.stringify(x)});result.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
