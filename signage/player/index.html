<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="theme-color" content="#08111f"><title>UPM Signage Player</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;color:#f8fafc;font-family:Inter,Segoe UI,system-ui,sans-serif}body{background:radial-gradient(circle at 85% 5%,#164e63 0,transparent 38%),linear-gradient(155deg,#07111f,#0f172a)}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(28px,5vh,76px);gap:4vh}.top{display:flex;justify-content:space-between;align-items:start}.event{font-size:clamp(18px,2.1vw,34px);font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:#67e8f9}.clock{font-size:clamp(18px,2vw,32px);color:#cbd5e1}.room{font-size:clamp(48px,8vw,128px);font-weight:760;line-height:.95;margin-top:1.5vh}.current{align-self:center}.label{color:#22d3ee;font-weight:750;letter-spacing:.22em}.current h1{font-size:clamp(44px,6.4vw,104px);line-height:1.02;max-width:16ch;margin:.25em 0}.presenters{font-size:clamp(24px,3vw,48px);color:#dbeafe}.next{display:grid;grid-template-columns:auto 1fr;gap:2rem;border-top:2px solid #22d3ee;padding-top:2.4vh;font-size:clamp(20px,2.5vw,40px)}.offline{position:fixed;right:20px;bottom:16px;color:#94a3b8;font-size:14px;opacity:0;transition:opacity .2s}.offline.show{opacity:1}@media(orientation:portrait){main{padding:7vh 7vw}.top{display:block}.clock{margin-top:1vh}.room{font-size:14vw}.current h1{font-size:10vw}.presenters{font-size:5vw}.next{grid-template-columns:1fr;font-size:4vw}}
</style></head><body><main><header class="top"><div><div class="event" id="event">UPM EVENT</div><div class="room" id="room">ROOM</div></div><div class="clock" id="clock"></div></header><section class="current"><div class="label">NOW</div><h1 id="title">Schedule loading…</h1><div class="presenters" id="presenters"></div></section><footer class="next"><strong>NEXT</strong><span id="next">—</span></footer></main><div id="offline" class="offline">OFFLINE · CACHED SCHEDULE</div><script>
const DB='upm-signage-player',STORE='state';const token=new URLSearchParams(location.search).get('token')||localStorage.token;if(token)localStorage.token=token;
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function save(v){let d=await db();d.transaction(STORE,'readwrite').objectStore(STORE).put(v,'manifest')}async function cached(){let d=await db();return new Promise(ok=>{let r=d.transaction(STORE).objectStore(STORE).get('manifest');r.onsuccess=()=>ok(r.result)})}
function render(x){room.textContent=x.current?.room_name||'ROOM';event.textContent=x.current?.event_name||'UPM EVENT';title.textContent=x.current?.title||'No session now';presenters.textContent=(x.current?.presenters||[]).join(' · ');next.textContent=x.next?`${new Date(x.next.starts_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}  ${x.next.title}`:'No upcoming session'}
async function load(){try{let r=await fetch('/api/v1/player/manifest',{headers:{authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status);let x=await r.json();render(x);await save(x);offline.classList.remove('show');fetch('/api/v1/player/heartbeat',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({media_ready:true,current_item:x.current?.session_id||null})})}catch(e){let x=await cached();if(x)render(x);offline.classList.add('show')}}setInterval(()=>clock.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),1000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/player/sw.js');load();setInterval(load,15000)
</script></body></html>
