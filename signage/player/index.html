<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>html,body{margin:0;height:100%;background:#08111f;color:white;font-family:system-ui}main{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:5vh;box-sizing:border-box}.room{font-size:7vw}.event{font-size:2.5vw;color:#7dd3fc}.current h1{font-size:5vw}.next{font-size:2.4vw;border-top:2px solid #38bdf8;padding-top:2vh}</style></head><body><main><header><div class="event" id="event">UPM EVENT</div><div class="room" id="room"></div></header><section class="current"><small>NOW</small><h1 id="title">Schedule unavailable</h1><p id="presenters"></p></section><footer class="next" id="next"></footer></main><script>const token=new URLSearchParams(location.search).get('token')||localStorage.token;if(token)localStorage.token=token;async function load(){try{let r=await fetch('/api/v1/player/manifest',{headers:{authorization:'Bearer '+token}});let x=await r.json();room.textContent=x.current?.room_name||'';event.textContent=x.current?.event_name||'UPM EVENT';title.textContent=x.current?.title||'No session now';presenters.textContent=(x.current?.presenters||[]).join(', ');next.textContent=x.next?'NEXT  '+x.next.title:'';await fetch('/api/v1/player/heartbeat',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({media_ready:true,current_item:x.current?.session_id||null})})}catch(e){/* retain last rendered frame */}}load();setInterval(load,15000)</script></body></html>
