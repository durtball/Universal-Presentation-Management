name: ${UPM_CENTRAL_PROJECT_NAME:-upm-central}

services:
  central-smb:
    build:
      context: .
      dockerfile: smb-edge/Dockerfile
    image: ${UPM_SMB_EDGE_IMAGE:-upm-smb-edge:local}
    restart: unless-stopped
    environment:
      UPM_SMB_HOSTNAME: ${UPM_CENTRAL_SMB_HOSTNAME:-UPM-CENTRAL}
      UPM_SMB_INTERFACES: ${UPM_CENTRAL_SMB_INTERFACES:-auto}
      UPM_SMB_OPERATOR_GID: ${UPM_CENTRAL_SMB_OPERATOR_GID:-20001}
      UPM_SMB_CONTROL_TOKEN: ${UPM_CENTRAL_SMB_CONTROL_TOKEN:?Set UPM_CENTRAL_SMB_CONTROL_TOKEN}
    ports:
      - "${UPM_CENTRAL_SMB_BIND_ADDRESS:-0.0.0.0}:445:445"
    volumes:
      - central-smb-presentations:/shares/presentations:ro
      - central-smb-incoming:/shares/incoming
      - central-smb-trash:/shares/trash
      - central-smb-state:/var/lib/samba/private
    networks:
      - central-edge
      - central-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  central-discovery:
    build:
      context: ./central/discovery/wsdd
    image: ${UPM_CENTRAL_DISCOVERY_IMAGE:-upm-central-discovery:local}
    restart: unless-stopped
    network_mode: host
    command: ["--hostname", "${UPM_CENTRAL_SMB_HOSTNAME:-UPM-CENTRAL}"]
    profiles: ["windows-discovery"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CENTRAL_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/caddy/central/Caddyfile:/etc/caddy/Caddyfile:ro
      - central-caddy-data:/data
      - central-caddy-config:/config
    depends_on:
      central-api:
        condition: service_healthy
      central-web:
        condition: service_healthy
    networks:
      central-edge:
      upm-integration:
        aliases:
          - upm-central

  central-api:
    build:
      context: .
      dockerfile: central/Dockerfile
    image: ${UPM_CENTRAL_API_IMAGE:-upm-central-api:local}
    restart: unless-stopped
    environment:
      UPM_COMPONENT: central-api
      DATABASE_HOST: central-postgres
      UPM_CENTRAL_DATABASE_URL: ${UPM_CENTRAL_DATABASE_URL:?Set UPM_CENTRAL_DATABASE_URL}
      UPM_CENTRAL_ADMIN_TOKEN: ${UPM_CENTRAL_ADMIN_TOKEN:?Set UPM_CENTRAL_ADMIN_TOKEN}
      UPM_CENTRAL_BOOTSTRAP_ADMIN_USERNAME: ${UPM_CENTRAL_BOOTSTRAP_ADMIN_USERNAME:-admin}
      UPM_CENTRAL_BOOTSTRAP_ADMIN_PASSWORD: ${UPM_CENTRAL_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      UPM_CENTRAL_ADMIN_COOKIE_SECURE: ${UPM_CENTRAL_ADMIN_COOKIE_SECURE:-false}
      UPM_CENTRAL_CREDENTIAL_ISSUER_KEY: ${UPM_CENTRAL_CREDENTIAL_ISSUER_KEY:?Set UPM_CENTRAL_CREDENTIAL_ISSUER_KEY}
      UPM_CENTRAL_PUBLIC_URL: ${UPM_CENTRAL_PUBLIC_URL:-http://upm-central}
      UPM_CENTRAL_MAX_UPLOAD_BYTES: ${UPM_CENTRAL_MAX_UPLOAD_BYTES:-549755813888}
      UPM_CENTRAL_TRANSFER_BLOCK_BYTES: ${UPM_CENTRAL_TRANSFER_BLOCK_BYTES:-4194304}
      UPM_CENTRAL_MEDIA_STORAGE_URL: http://central-media-storage:8080
      UPM_CENTRAL_MEDIA_STORAGE_TOKEN: ${UPM_CENTRAL_MEDIA_STORAGE_TOKEN:?Set UPM_CENTRAL_MEDIA_STORAGE_TOKEN}
      UPM_CENTRAL_SMB_INTAKE_SCAN_INTERVAL_SECONDS: ${UPM_CENTRAL_SMB_INTAKE_SCAN_INTERVAL_SECONDS:-5}
      UPM_CENTRAL_SMB_INTAKE_STABILITY_SECONDS: ${UPM_CENTRAL_SMB_INTAKE_STABILITY_SECONDS:-10}
      UPM_CENTRAL_SMB_CONTROL_URL: http://central-smb:8080
      UPM_CENTRAL_SMB_CONTROL_TOKEN: ${UPM_CENTRAL_SMB_CONTROL_TOKEN:?Set UPM_CENTRAL_SMB_CONTROL_TOKEN}
    depends_on:
      central-postgres:
        condition: service_healthy
      central-migrate:
        condition: service_completed_successfully
      central-media-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - central-edge
      - central-internal

  central-web:
    build:
      context: .
      dockerfile: central/web/Dockerfile
    image: ${UPM_CENTRAL_WEB_IMAGE:-upm-central-web:local}
    restart: unless-stopped
    environment:
      UPM_COMPONENT: central-web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - central-edge

  central-migrate:
    image: ${UPM_CENTRAL_API_IMAGE:-upm-central-api:local}
    restart: "no"
    command: ["alembic", "-c", "database/central/alembic.ini", "upgrade", "head"]
    environment:
      UPM_COMPONENT: central-migrate
      DATABASE_HOST: central-postgres
      UPM_CENTRAL_DATABASE_URL: ${UPM_CENTRAL_DATABASE_URL:?Set UPM_CENTRAL_DATABASE_URL}
    depends_on:
      central-postgres:
        condition: service_healthy
    networks:
      - central-internal

  central-worker:
    image: ${UPM_CENTRAL_API_IMAGE:-upm-central-api:local}
    restart: unless-stopped
    command: ["python", "-m", "upm_central.worker"]
    environment:
      UPM_COMPONENT: central-worker
      DATABASE_HOST: central-postgres
      UPM_CENTRAL_DATABASE_URL: ${UPM_CENTRAL_DATABASE_URL:?Set UPM_CENTRAL_DATABASE_URL}
      UPM_CENTRAL_ADMIN_TOKEN: ${UPM_CENTRAL_ADMIN_TOKEN:?Set UPM_CENTRAL_ADMIN_TOKEN}
      UPM_CENTRAL_CREDENTIAL_ISSUER_KEY: ${UPM_CENTRAL_CREDENTIAL_ISSUER_KEY:?Set UPM_CENTRAL_CREDENTIAL_ISSUER_KEY}
      UPM_CENTRAL_WORKER_CAPABILITIES: ${UPM_CENTRAL_WORKER_CAPABILITIES:-cpu,pdf-conversion,transfer}
      UPM_CENTRAL_WORKER_POLL_INTERVAL_SECONDS: ${UPM_CENTRAL_WORKER_POLL_INTERVAL_SECONDS:-1}
      UPM_CENTRAL_WORKER_LEASE_SECONDS: ${UPM_CENTRAL_WORKER_LEASE_SECONDS:-60}
      UPM_CENTRAL_PRESENTATION_MEDIA_CONCURRENCY: ${UPM_CENTRAL_PRESENTATION_MEDIA_CONCURRENCY:-4}
      UPM_CENTRAL_MEDIA_STORAGE_URL: http://central-media-storage:8080
      UPM_CENTRAL_MEDIA_STORAGE_TOKEN: ${UPM_CENTRAL_MEDIA_STORAGE_TOKEN:?Set UPM_CENTRAL_MEDIA_STORAGE_TOKEN}
      UPM_CENTRAL_SMB_INTAKE_SCAN_INTERVAL_SECONDS: ${UPM_CENTRAL_SMB_INTAKE_SCAN_INTERVAL_SECONDS:-5}
      UPM_CENTRAL_SMB_INTAKE_STABILITY_SECONDS: ${UPM_CENTRAL_SMB_INTAKE_STABILITY_SECONDS:-10}
    depends_on:
      central-postgres:
        condition: service_healthy
      central-migrate:
        condition: service_completed_successfully
      central-media-storage:
        condition: service_healthy
    networks:
      - central-internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/upm-central-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  central-media-storage:
    build:
      context: .
      dockerfile: media-storage/Dockerfile
    image: ${UPM_MEDIA_STORAGE_IMAGE:-upm-media-storage:local}
    restart: unless-stopped
    group_add:
      - "${UPM_CENTRAL_SMB_OPERATOR_GID:-20001}"
    environment:
      UPM_MEDIA_STORAGE_DEPLOYMENT_CONTEXT: central
      UPM_MEDIA_STORAGE_SERVICE_TOKEN: ${UPM_CENTRAL_MEDIA_STORAGE_TOKEN:?Set UPM_CENTRAL_MEDIA_STORAGE_TOKEN}
      UPM_MEDIA_STORAGE_STATE_PATH: /state/assignments.json
      UPM_MEDIA_STORAGE_SMB_INCOMING_PATH: /smb/incoming
      UPM_MEDIA_STORAGE_SMB_PRESENTATIONS_PATH: /smb/presentations
      UPM_MEDIA_STORAGE_TARGETS_JSON: '${UPM_CENTRAL_STORAGE_TARGETS_JSON:-[{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000004","name":"Central Staging Storage","internal_path":"/storage/staging","roles":["staging"]},{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000002","name":"Central Media Storage","internal_path":"/storage/media","roles":["media"]},{"storage_target_id":"0198b8d0-63e0-7000-8000-000000000001","name":"Central Temporary Storage","internal_path":"/storage/temp","roles":["staging"]}]}'
    volumes:
      - ${UPM_CENTRAL_STAGING_HOST_PATH:-central-storage-staging}:/storage/staging
      - ${UPM_CENTRAL_MEDIA_HOST_PATH:-central-storage-media}:/storage/media
      - ${UPM_CENTRAL_TEMP_HOST_PATH:-central-storage-temp}:/storage/temp
      - central-storage-state:/state
      - central-smb-presentations:/smb/presentations
      - central-smb-incoming:/smb/incoming
      - central-smb-trash:/smb/trash
    networks:
      - central-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  central-sync:
    image: ${UPM_CENTRAL_API_IMAGE:-upm-central-api:local}
    restart: unless-stopped
    command: ["python", "-m", "upm_central.worker", "--sync"]
    environment:
      UPM_COMPONENT: central-sync
      DATABASE_HOST: central-postgres
      UPM_CENTRAL_DATABASE_URL: ${UPM_CENTRAL_DATABASE_URL:?Set UPM_CENTRAL_DATABASE_URL}
      UPM_CENTRAL_ADMIN_TOKEN: ${UPM_CENTRAL_ADMIN_TOKEN:?Set UPM_CENTRAL_ADMIN_TOKEN}
      UPM_CENTRAL_CREDENTIAL_ISSUER_KEY: ${UPM_CENTRAL_CREDENTIAL_ISSUER_KEY:?Set UPM_CENTRAL_CREDENTIAL_ISSUER_KEY}
      UPM_CENTRAL_WORKER_CAPABILITIES: sync
    depends_on:
      central-postgres:
        condition: service_healthy
      central-migrate:
        condition: service_completed_successfully
    networks:
      - central-internal
      - central-sync-egress
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/upm-central-worker-ready-sync"]
      interval: 10s
      timeout: 3s
      retries: 5

  central-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CENTRAL_POSTGRES_DB:?Set CENTRAL_POSTGRES_DB}
      POSTGRES_USER: ${CENTRAL_POSTGRES_USER:?Set CENTRAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CENTRAL_POSTGRES_PASSWORD:?Set CENTRAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CENTRAL_POSTGRES_USER:?Set CENTRAL_POSTGRES_USER} -d ${CENTRAL_POSTGRES_DB:?Set CENTRAL_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - central-postgres-data:/var/lib/postgresql/data
    networks:
      - central-internal

networks:
  central-edge:
  central-internal:
    internal: true
  central-sync-egress:
  upm-integration:
    name: ${UPM_INTEGRATION_NETWORK:-upm-integration}
    external: ${UPM_INTEGRATION_NETWORK_EXTERNAL:-true}

volumes:
  central-caddy-data:
  central-caddy-config:
  central-postgres-data:
  central-storage-temp:
  central-storage-staging:
  central-storage-media:
  central-storage-state:
  central-smb-presentations:
  central-smb-incoming:
  central-smb-trash:
  central-smb-state:
